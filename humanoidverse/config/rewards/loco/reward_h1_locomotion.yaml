# @package _global_

# E2E Goal Reaching 보상 구조 v18 - PPO only
# 핵심 변경:
# 1) goal_reached는 signed progress reward로 사용하되, 과속 보상화를 막기 위해 progress cap을 둔다.
# 2) goal_bonus는 stable goal 조건을 만족했을 때만 1회 지급한다.
# 3) lin_vel_toward_goal은 progress reward와 중복되므로 scale 0으로 끈다.
# 4) goal_heading을 강화해 목표 방향으로 몸을 정렬하도록 유도한다.
# 5) penalty curriculum은 끄고 YAML scale을 그대로 적용한다.

rewards:
  set_reward: E2E_GoalReaching_PPO_v18_verified_curriculum70
  set_reward_date: 20260714
  only_positive_rewards: False
  reward_scales:
      # ── E2E 메인 보상 ──────────────────────────────
      # 함수명은 기존 호환을 위해 goal_reached지만, 내용은 signed progress reward다.
      goal_reached: 80.0          # (prev_dist - curr_dist), 음수 허용 + progress cap
      goal_bonus: 40.0            # stable goal 도달 시 1회 sparse bonus
      lin_vel_toward_goal: 0.0    # progress reward와 중복되므로 비활성화
      goal_heading: 2.0           # 몸의 전방이 목표를 향하도록 유도

      # ── 걷기 품질 ──────────────────────────────────
      feet_air_time: 0.8
      penalty_feet_height: -2.0
      penalty_feet_ori: -1.0

      # ── 몸통 안정 ──────────────────────────────────
      base_height: -12.0
      penalty_orientation: -1.5
      penalty_lin_vel_z: -3.0
      penalty_ang_vel_xy: -1.5
      termination: -70.0
      penalty_unstable_goal: -10.0
      penalty_speed_limit: 0.0

      # ── 관절 효율 ──────────────────────────────────
      penalty_torques: -0.00001
      penalty_dof_acc: -3.5e-8
      penalty_action_rate: -0.012
      limits_dof_pos: -10.0

      # ── 장애물 안전 ────────────────────────────────
      penalty_obstacle_collision: -40.0
      penalty_obstacle_proximity: -2.0

      # ── [스타일 보상] CMU mocap 걷기 모션 모방 보상 (정상일 추가, master 브랜치에서 병합) ──
      # 1.2로 8m 도달 후 style_imitation이 0.35 근처에서 정체(3시간+ 평행선) 확인.
      # mocap 클립 분리 수정 이후이므로 완만하게 1.7로 상향 (2026.07.20)
      # 19-DOF 전신 확장 + entropy_coef 수정 이후 8m 근처에서 style_imitation이 완전히 0으로
      # 죽는 현상 확인 (2026.07.22) — 상체가 모캡과 너무 멀어져 exp() 신호가 사라진 것으로 판단,
      # sigma를 넓혀 재개.
      style_imitation: 1.7

      # 상체 관절을 기본자세 근처로 유지하도록 유도하는 안전장치.
      # style_imitation만으로는 신호가 죽었을 때 상체가 임의의 자세로 고정되는 문제(팔 들림,
      # 상체 틀어짐)가 관측되어 추가함 (2026.07.22).
      upperbody_joint_angle_freeze: -0.1

  reward_tracking_sigma:
    lin_vel: 0.25
    ang_vel: 0.25

  # [스타일 보상] 관절 각도 오차 민감도 (정상일 추가)
  # 0.5 -> 1.5: 8m 근처에서 신호가 완전히 죽는 문제 확인 후 완화 (2026.07.22)
  style_imitation_sigma: 0.8

  reward_limit:
    soft_dof_pos_limit: 0.9
    soft_dof_vel_limit: 0.9
    soft_torque_limit: 0.9

  feet_height_target: 0.2
  locomotion_max_contact_force: 200.0
  desired_feet_max_height_for_this_air: 0.2
  desired_base_height: 0.98

  reward_penalty_curriculum: False
  reward_initial_penalty_scale: 1.0
  reward_min_penalty_scale: 0.0
  reward_max_penalty_scale: 1.0
  reward_penalty_level_down_threshold: 400
  reward_penalty_level_up_threshold: 700
  reward_penalty_degree: 0.00001
  num_compute_average_epl: 10000

  # penalty curriculum은 꺼져 있지만, 프레임워크 호환을 위해 리스트는 유지한다.
  reward_penalty_reward_names: [
    "penalty_torques",
    "penalty_dof_acc",
    "penalty_dof_vel",
    "penalty_action_rate",
    "penalty_feet_contact_forces",
    "penalty_stumble",
    "penalty_slippage",
    "penalty_feet_ori",
    "penalty_in_the_air",
    "limits_dof_pos",
    "limits_dof_vel",
    "limits_torque",
    "termination",
    "penalty_unstable_goal",
    "penalty_speed_limit",
    "penalty_obstacle_collision",
    "penalty_obstacle_proximity"]
