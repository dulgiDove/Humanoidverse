hydra:
  run:
    dir: ${save_dir}
  sweep:
    dir: ${save_dir}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - +simulator=genesis
    - +exp=locomotion_amp
    - +domain_rand=NO_domain_rand
    - +rewards=loco/reward_h1_locomotion
    - +robot=h1/h1
    - +terrain=terrain_locomotion_plane
    - +obs=loco/leggedloco_obs_singlestep_withlinvel
    - num_envs=480
    - headless=True
    - auto_load_latest=False
    - rewards.reward_scales.style_imitation=0
    - algo.config.amp.gp_type=r1
    - algo.config.amp.grad_penalty_coef=1.0
    - algo.config.amp.use_velocity=True
    - +checkpoint=/home/jsi1022/Humanoidverse/logs/LAFAN1_BVH_IK/20260923_145521-obsC_margin-locomotion-h1/model_21900.pt
    - project_name=LAFAN1_BVH_IK
    - experiment_name=C_fullbody_collision
    - rewards.obstacle_safe_margin_extra=1.8
    - rewards.reward_scales.penalty_obstacle_proximity=-4.0
  job:
    name: train_agent
    chdir: false
    override_dirname: +checkpoint=/home/jsi1022/Humanoidverse/logs/LAFAN1_BVH_IK/20260923_145521-obsC_margin-locomotion-h1/model_21900.pt,+domain_rand=NO_domain_rand,+exp=locomotion_amp,+obs=loco/leggedloco_obs_singlestep_withlinvel,+rewards=loco/reward_h1_locomotion,+robot=h1/h1,+simulator=genesis,+terrain=terrain_locomotion_plane,algo.config.amp.gp_type=r1,algo.config.amp.grad_penalty_coef=1.0,algo.config.amp.use_velocity=True,auto_load_latest=False,experiment_name=C_fullbody_collision,headless=True,num_envs=480,project_name=LAFAN1_BVH_IK,rewards.obstacle_safe_margin_extra=1.8,rewards.reward_scales.penalty_obstacle_proximity=-4.0,rewards.reward_scales.style_imitation=0
    id: ???
    num: ???
    config_name: base
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.4
    version_base: '1.1'
    cwd: /home/jsi1022/Humanoidverse
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/jsi1022/Humanoidverse/humanoidverse/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/jsi1022/Humanoidverse/logs/LAFAN1_BVH_IK/20261003_215621-C_fullbody_collision-locomotion-h1/.hydra
    choices:
      obs: loco/leggedloco_obs_singlestep_withlinvel
      terrain: terrain_locomotion_plane
      robot: h1/h1
      rewards: loco/reward_h1_locomotion
      domain_rand: NO_domain_rand
      exp: locomotion_amp
      env: locomotion
      algo: amp_ppo
      simulator: genesis
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
