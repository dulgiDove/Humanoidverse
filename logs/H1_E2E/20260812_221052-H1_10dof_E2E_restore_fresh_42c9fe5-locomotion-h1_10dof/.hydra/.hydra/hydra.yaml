hydra:
  run:
    dir: ${save_dir}
  sweep:
    dir: ${save_dir}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - +simulator=genesis
    - +exp=locomotion
    - +domain_rand=NO_domain_rand
    - +rewards=loco/reward_h1_locomotion
    - +robot=h1/h1_10dof
    - +terrain=terrain_locomotion_plane
    - +obs=loco/leggedloco_obs_singlestep_withlinvel
    - num_envs=512
    - project_name=H1_E2E
    - experiment_name=H1_10dof_E2E_restore_fresh_42c9fe5
    - headless=True
    - rewards.reward_penalty_curriculum=False
  job:
    name: train_agent
    chdir: false
    override_dirname: +domain_rand=NO_domain_rand,+exp=locomotion,+obs=loco/leggedloco_obs_singlestep_withlinvel,+rewards=loco/reward_h1_locomotion,+robot=h1/h1_10dof,+simulator=genesis,+terrain=terrain_locomotion_plane,experiment_name=H1_10dof_E2E_restore_fresh_42c9fe5,headless=True,num_envs=512,project_name=H1_E2E,rewards.reward_penalty_curriculum=False
    id: ???
    num: ???
    config_name: base
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.5
    version_base: '1.1'
    cwd: /home/dulgi/projects/HumanoidVerse
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/dulgi/projects/HumanoidVerse/humanoidverse/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/dulgi/projects/HumanoidVerse/logs/H1_E2E/20260812_221052-H1_10dof_E2E_restore_fresh_42c9fe5-locomotion-h1_10dof/.hydra
    choices:
      obs: loco/leggedloco_obs_singlestep_withlinvel
      terrain: terrain_locomotion_plane
      robot: h1/h1_10dof
      rewards: loco/reward_h1_locomotion
      domain_rand: NO_domain_rand
      exp: locomotion
      env: locomotion
      algo: ppo
      simulator: genesis
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
